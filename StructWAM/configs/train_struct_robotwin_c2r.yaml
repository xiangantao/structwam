# StructWAM on RoboTwin 2.0, Clean2Random protocol (OpenWAM): train on clean_50 only (50 tasks x 50
# demos, aloha-agilex, eef 20-D), evaluate on demo_clean and demo_randomized.  b2 recipe.
#   data     : datasets/robotwin2.0/dataset (OpenWAM layout; stats meta/robotwin_clean_50_normalization_stats.npy)
#   cameras  : structure stream on head + left wrist + right wrist (canvas [head | left, right])
#   student  : RoboTwin-clean-distilled structure student (LIBERO-selected teacher heads),
#              runs/robotwin_student/g2_libero_heads
#   budget   : 40,000 micro-steps = 20,000 optimizer updates x 128 = 2.56M samples ~ 4.6 epochs of the
#              ~550k clean windows (8 NPUs x batch 8 x accumulation 2)
#   b2       : video loss does not train the structure expert, no track loss, video dropout 0.3, consistent augmentation
defaults:
  - train_struct
  - override dataloader: robotwin_struct
  - _self_

training:
  max_steps: 40000
  dataset_num_workers: 4
  output_path: outputs/structwam_robotwin_c2r_checkpoints

dataloader:
  dataset_dir: ${oc.env:STRUCTWAM_ASSETS}/datasets/robotwin2.0/dataset
  variant: clean_50
  structure_augment:
    enabled: true

model:
  architecture:
    structure:
      cameras: [head, wrist, wrist_right]
      video_detach: [structure]
      action_video_dropout: 0.3
      losses:
        lambda_track: 0.0
      student:
        cameras: [head, wrist, wrist_right]
        checkpoint: ${oc.env:STRUCTWAM_ASSETS}/student_robotwin/step_0002000.pt
        appearance_stats: ${oc.env:STRUCTWAM_ASSETS}/student_robotwin/appearance_stats.npz
        async_maps: false
        maps_profile: null
        chunk: 8                    # one camera per student forward: 24 windows at once OOM next to the training state

project:
  name: structwam_robotwin_c2r
