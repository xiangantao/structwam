# Two instances x 8 Ascend NPUs. max_steps counts micro-batches.
defaults:
  - train_struct
  - _self_

training:
  num_epochs: null
  max_steps: 20000
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 1e-4
  warmup_ratio: 0.05
  lr_scheduler: cosine
  dataset_num_workers: 2
  save_steps: 1000
  save_full_states_for_resume: true
  keep_last_k_ckpts: 2
