data:
  train: ../datasets/SSv2/labels/train.csv
  val: ../datasets/SSv2/labels/validation.csv
  videos: ../datasets/SSv2/videos
  labels: ../datasets/SSv2/labels/labels.json
  num_classes: 174
  num_segments: 2
  num_views_per_segment: 3
  frame_step: 4
  crop_size: 256
model_path: ../models/vjepa2/vitl.pt
vjepa_root: ../vjepa2
